name: build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64

          - runner: ubuntu-26.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: check
        run: uname -a && echo && free -h && echo && df -h && echo && lscpu

      - name: build
        run: chmod +x build.sh && ARCH=${{ matrix.arch }} ./build.sh

      - name: generate tag
        id: tag
        run: |
          echo "tag=build-${{ matrix.arch }}-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Build ${{ matrix.arch }} ${{ steps.tag.outputs.tag }}
          files: |
            out/*